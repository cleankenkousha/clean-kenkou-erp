[build]
  command = "npm run build"
  publish = "dist"

# ── 環境変数 ──
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY は
# Netlify Dashboard > Site settings > Environment variables で設定してください。
# セキュリティ上、このファイルにはハードコードしません。

# ── セキュリティヘッダー (全ページ共通) ──
[[headers]]
  for = "/*"
  [headers.values]
    # クリックジャッキング対策
    X-Frame-Options = "DENY"
    # MIMEスニッフィング防止
    X-Content-Type-Options = "nosniff"
    # XSS フィルタ (レガシーブラウザ向け)
    X-XSS-Protection = "1; mode=block"
    # リファラー情報の制限
    Referrer-Policy = "strict-origin-when-cross-origin"
    # カメラ・マイク・位置情報等の制限
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    # Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: data: https://cnwlcxfhxaugqtatibav.supabase.co wss://cnwlcxfhxaugqtatibav.supabase.co https://cnwlcxfhxaugqtatibav.supabase.co:*; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"

# sw.js は絶対にキャッシュしない（常に最新を取得）
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

# Web App Manifest（no-cache に留め WebAPK ミンティングの取得互換性を維持）
[[headers]]
  for = "/manifest-erp.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

# SPA ルーティング用リダイレクト
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
