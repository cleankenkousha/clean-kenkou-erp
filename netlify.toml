[build]
  command = "npm run build"
  publish = "dist"

# ── 環境変数 ──
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY は
# Netlify Dashboard > Site settings > Environment variables で設定してください。
# セキュリティ上、このファイルにはハードコードしません。

# ── セキュリティヘッダー (全ページ共通) ──
[[headers]]
  for = "/*"
  [headers.values]
    # クリックジャッキング対策
    X-Frame-Options = "DENY"
    # MIMEスニッフィング防止
    X-Content-Type-Options = "nosniff"
    # XSS フィルタ (レガシーブラウザ向け)
    X-XSS-Protection = "1; mode=block"
    # リファラー情報の制限
    Referrer-Policy = "strict-origin-when-cross-origin"
    # カメラ・マイク・位置情報等の制限
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy
    # - Supabase API・Realtime・Auth を明示許可
    # - Google Fonts を許可
    # - data: URI (電子サイン描画に必要)
    # - style-src の 'unsafe-inline' はTailwind/Vite産のスタイルに対応するため許可
    # - script-src から 'unsafe-inline' を除去（インラインスクリプトは外部ファイルに移行済み）
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://cnwlcxfhxaugqtatibav.supabase.co wss://cnwlcxfhxaugqtatibav.supabase.co https://cnwlcxfhxaugqtatibav.supabase.co:*; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"

# sw.js は絶対にキャッシュしない（常に最新を取得）
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

# manifest.json も短めのキャッシュにする
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

# SPA ルーティング用リダイレクト
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

